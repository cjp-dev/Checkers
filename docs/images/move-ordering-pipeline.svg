<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" height="auto" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="860" height="400" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="430" y="28" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1E293B">7-Tier Move Ordering Priority Spectrum &amp; Cutoff Feedback Loop</text>
  <text x="430" y="46" text-anchor="middle" font-size="11.5" fill="#64748B">Single-Pass Stack Pre-Scoring (Span&lt;int&gt; scores = stackalloc int[count]) + O(1) Zero-Skip Insertion Sort</text>

  <!-- LEFT PANEL: 7-Tier Priority Spectrum -->
  <g transform="translate(26,64)">
    <rect width="470" height="314" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
    <text x="235" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Move Ordering Score Tiers S(m)</text>

    <!-- Tier 1: TT Move -->
    <rect x="16" y="36" width="438" height="34" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <text x="28" y="57" font-size="11.5" font-weight="700" fill="#14532D">1. Transposition Table Hash Move</text>
    <text x="442" y="57" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#15803D">10,000,000</text>

    <!-- Tier 2: Captures -->
    <rect x="16" y="76" width="438" height="34" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <text x="28" y="97" font-size="11.5" font-weight="700" fill="#1E3A8A">2. Mandatory Captures (MVV / Jump Chain Length)</text>
    <text x="442" y="97" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1D4ED8">1,000,000 + 10k·c + 1k·p</text>

    <!-- Tier 3: Quiet Promotion -->
    <rect x="16" y="116" width="438" height="34" rx="5" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="28" y="137" font-size="11.5" font-weight="700" fill="#312E81">3. Quiet Crown-Row Promotion</text>
    <text x="442" y="137" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#4338CA">500,000</text>

    <!-- Tier 4: Killer 1 -->
    <rect x="16" y="156" width="438" height="34" rx="5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="28" y="177" font-size="11.5" font-weight="700" fill="#78350F">4. Primary Killer Move (_killers[ply * 2])</text>
    <text x="442" y="177" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#B45309">90,000</text>

    <!-- Tier 5: Killer 2 -->
    <rect x="16" y="196" width="438" height="34" rx="5" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
    <text x="28" y="217" font-size="11.5" font-weight="700" fill="#9A3412">5. Secondary Killer Move (_killers[ply * 2 + 1])</text>
    <text x="442" y="217" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#C2410C">80,000</text>

    <!-- Tier 6: History Heuristic -->
    <rect x="16" y="236" width="438" height="34" rx="5" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
    <text x="28" y="257" font-size="11.5" font-weight="700" fill="#581C87">6. Quiet History Heuristic (_history[side, from, to])</text>
    <text x="442" y="257" text-anchor="end" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#7E22CE">1 .. 70,000</text>

    <!-- Tier 7: Unscored Quiet Moves -->
    <rect x="16" y="276" width="438" height="28" rx="5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="28" y="294" font-size="11" font-weight="600" fill="#475569">7. Unscored Quiet Slides (Skipped in O(1) during sort)</text>
    <text x="442" y="294" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#64748B">0</text>
  </g>

  <!-- RIGHT PANEL: Beta-Cutoff Feedback Loop (Killers & History) -->
  <g transform="translate(514,64)">
    <rect width="320" height="314" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
    <text x="160" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Quiet β-Cutoff Feedback (α ≥ β)</text>

    <!-- Trigger Box -->
    <rect x="18" y="38" width="284" height="44" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="160" y="56" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">Quiet Move Triggers β-Cutoff at (depth d, ply)</text>
    <text x="160" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#B91C1C">packed = (From &lt;&lt; 8) | To</text>

    <!-- Killer Table Update -->
    <rect x="18" y="96" width="284" height="92" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="160" y="115" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350F">1. Two-Slot FIFO Killer Table per Ply</text>
    <text x="160" y="133" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#92400E">if (packed != Killer1[ply])</text>
    <rect x="34" y="142" width="112" height="34" rx="4" fill="#FFFFFF" stroke="#D97706"/>
    <text x="90" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#78350F">Killer 1 (90k)</text>
    <text x="90" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#B45309">← New packed</text>

    <line x1="148" y1="159" x2="170" y2="159" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>

    <rect x="174" y="142" width="112" height="34" rx="4" fill="#FFFFFF" stroke="#EA580C"/>
    <text x="230" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#9A3412">Killer 2 (80k)</text>
    <text x="230" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#C2410C">← Old Killer 1</text>

    <!-- History Table Update -->
    <rect x="18" y="200" width="284" height="98" rx="6" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.5"/>
    <text x="160" y="219" text-anchor="middle" font-size="11.5" font-weight="700" fill="#581C87">2. Depth-Squared History Table [2 × 64 × 64]</text>
    <text x="160" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6B21A8">idx = (side &lt;&lt; 12) | (from &lt;&lt; 6) | to</text>
    <text x="160" y="256" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#7E22CE">H[idx] = min(70000, H[idx] + d * d)</text>
    <text x="160" y="276" text-anchor="middle" font-size="10" fill="#581C87">Clamped to 70,000 so global history never</text>
    <text x="160" y="290" text-anchor="middle" font-size="10" fill="#581C87">out-ranks ply-specific Killer 1/2 refutations</text>
  </g>
</svg>
