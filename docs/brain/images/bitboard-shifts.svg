<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="100%" height="auto" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#EA580C"/>
    </marker>
  </defs>

  <rect width="860" height="390" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="430" y="28" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1E293B">64-Bit Bitboard Representation &amp; Parallel Diagonal Shifts</text>
  <text x="430" y="46" text-anchor="middle" font-size="11.5" fill="#64748B">BitPosition (48-byte value struct) + Guarded Bitwise Shifts + Hardware TZCNT / LZCNT Ray Scans</text>

  <!-- LEFT: BitPosition 48-byte Struct Layout -->
  <g transform="translate(30,66)">
    <rect width="265" height="295" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
    <text x="132" y="25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">BitPosition Struct (48 Bytes)</text>

    <rect x="18" y="38" width="229" height="32" rx="5" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="132" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1E3A8A">ulong WhiteMen   (8 bytes)</text>

    <rect x="18" y="76" width="229" height="32" rx="5" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="132" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1E3A8A">ulong BlackMen   (8 bytes)</text>

    <rect x="18" y="114" width="229" height="32" rx="5" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="132" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1E3A8A">ulong WhiteKings (8 bytes)</text>

    <rect x="18" y="152" width="229" height="32" rx="5" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="132" y="172" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1E3A8A">ulong BlackKings (8 bytes)</text>

    <rect x="18" y="190" width="229" height="32" rx="5" fill="#F0FDF4" stroke="#16A34A"/>
    <text x="132" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#14532D">ulong Hash       (8 bytes)</text>

    <rect x="18" y="228" width="229" height="32" rx="5" fill="#FEF3C7" stroke="#D97706"/>
    <text x="132" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#78350F">int HalfMoveClock + SideToMove</text>

    <text x="132" y="280" text-anchor="middle" font-size="10.5" fill="#475569">Zero Heap Allocations • Stack Copy-Make</text>
  </g>

  <!-- MIDDLE: Diagonal Shift Equations & File Guards -->
  <g transform="translate(315,66)">
    <rect width="265" height="295" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
    <text x="132" y="25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">4 Diagonal Bit-Shift Vectors</text>

    <!-- 3x3 Mini Grid showing sq = 27 -->
    <g transform="translate(67,42)">
      <rect x="0" y="0" width="44" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
      <text x="22" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E3A8A">UL (−9)</text>
      <text x="22" y="33" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#1D4ED8">&gt;&gt; 9</text>

      <rect x="44" y="0" width="44" height="44" fill="#F8FAFC" stroke="#CBD5E0"/>
      <rect x="88" y="0" width="44" height="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
      <text x="110" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1E3A8A">UR (−7)</text>
      <text x="110" y="33" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#1D4ED8">&gt;&gt; 7</text>

      <rect x="0" y="44" width="44" height="44" fill="#F8FAFC" stroke="#CBD5E0"/>
      <rect x="44" y="44" width="44" height="44" fill="#1E293B" stroke="#0F172A"/>
      <text x="66" y="69" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#FFFFFF">sq</text>
      <rect x="88" y="44" width="44" height="44" fill="#F8FAFC" stroke="#CBD5E0"/>

      <rect x="0" y="88" width="44" height="44" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
      <text x="22" y="106" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9A3412">DL (+7)</text>
      <text x="22" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#C2410C">&lt;&lt; 7</text>

      <rect x="44" y="88" width="44" height="44" fill="#F8FAFC" stroke="#CBD5E0"/>
      <rect x="88" y="88" width="44" height="44" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
      <text x="110" y="106" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9A3412">DR (+9)</text>
      <text x="110" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#C2410C">&lt;&lt; 9</text>
    </g>

    <!-- Guard Mask Equations -->
    <g font-family="Consolas, monospace" font-size="10.5" fill="#1E293B">
      <text x="16" y="198">UL: ((bb &amp; NotColA) &gt;&gt; 9) &amp; empty</text>
      <text x="16" y="218">UR: ((bb &amp; NotColH) &gt;&gt; 7) &amp; empty</text>
      <text x="16" y="238">DL: ((bb &amp; NotColA) &lt;&lt; 7) &amp; empty</text>
      <text x="16" y="258">DR: ((bb &amp; NotColH) &lt;&lt; 9) &amp; empty</text>
    </g>
    <text x="132" y="282" text-anchor="middle" font-size="10.5" fill="#475569">NotColA / NotColH prevent row wrap-around</text>
  </g>

  <!-- RIGHT: Flying King Ray Scan & Speedup Summary -->
  <g transform="translate(600,66)">
    <rect width="230" height="295" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
    <text x="115" y="25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E293B">Flying King Ray Scan</text>

    <rect x="14" y="38" width="202" height="108" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="22" y="58" font-family="Consolas, monospace" font-size="10" fill="#0F172A">blockers = ray &amp; occupied;</text>
    <text x="22" y="78" font-size="10.5" font-weight="600" fill="#1E3A8A">Down Rays (DL +7, DR +9):</text>
    <text x="22" y="94" font-family="Consolas, monospace" font-size="10" fill="#1D4ED8">first = TZCNT(blockers)</text>
    <text x="22" y="116" font-size="10.5" font-weight="600" fill="#9A3412">Up Rays (UL −9, UR −7):</text>
    <text x="22" y="132" font-family="Consolas, monospace" font-size="10" fill="#C2410C">first = 63 - LZCNT(blockers)</text>

    <!-- Empirical Benchmark Highlights -->
    <rect x="14" y="158" width="202" height="122" rx="6" fill="#F0FDF4" stroke="#16A34A"/>
    <text x="115" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Empirical Speedup (40 Pos)</text>
    <text x="115" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">65.1x Faster (Standard No-TT)</text>
    <text x="115" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">53.8x Faster (Deep ~95M Nodes)</text>
    <text x="115" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">35.6M Nodes/sec Throughput</text>
    <text x="115" y="254" text-anchor="middle" font-size="10.5" fill="#15803D">100% Node-for-Node Equivalence</text>
    <text x="115" y="270" text-anchor="middle" font-size="10" fill="#15803D">(>220x combined with 1M TT)</text>
  </g>
</svg>
