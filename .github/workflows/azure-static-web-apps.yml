name: Deploy web version

on:
  push:
    branches: [ main ]
    paths:
      - 'src/Checkers.Web/**'
      - 'src/Checkers.Web.Engine/**'
      - 'src/Checkers.App/**'
      - 'src/Checkers.Core/**'
      - 'docs/brain/**'
      - 'Images/**'
      - 'external/GameShell'
      - 'external/GameShell/**'
      - '.gitmodules'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # The shared GUI (GameShell) is a git submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      # The multithreaded (Lazy SMP) engine is a second .NET runtime, served from /engine/_framework/.
      - name: Publish the multithreaded engine (AOT)
        run: dotnet publish src/Checkers.Web.Engine/Checkers.Web.Engine.csproj -c Release -o engine_publish

      - name: Publish (AOT)
        run: dotnet publish src/Checkers.Web/Checkers.Web.csproj -c Release -o publish

      - name: Add the engine to the site
        run: |
          mkdir -p publish/wwwroot/engine/_framework
          cp -r engine_publish/wwwroot/_framework/* publish/wwwroot/engine/_framework/

      # The app is already built, so the action only uploads the static files.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
